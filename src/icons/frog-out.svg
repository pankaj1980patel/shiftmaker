<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" stroke="#2f6b1f" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
  <!-- Punch Out: frog sprinting out the door at 6:30 -->
  <!-- speed lines -->
  <path d="M2 30h8M1 38h7M3 46h7" stroke="#9e9e9e" stroke-width="2.2"/>
  <!-- back leg kicked up -->
  <path d="M18 48l-7 5" stroke-width="6"/>
  <path d="M18 48l-7 5" stroke-width="3.2" stroke="#5aa83e"/>
  <ellipse cx="9.5" cy="54" rx="4.5" ry="2.6" fill="#5aa83e" transform="rotate(-30 9.5 54)"/>
  <!-- back arm swinging -->
  <path d="M19 40l-6-3" stroke-width="5"/>
  <path d="M19 40l-6-3" stroke-width="2.4" stroke="#5aa83e"/>
  <circle cx="12" cy="36.5" r="3.2" fill="#5aa83e"/>
  <!-- body (leaning forward) -->
  <ellipse cx="29" cy="44" rx="13.5" ry="12" fill="#6abf4b" transform="rotate(-12 29 44)"/>
  <path d="M18 50c4 5 14 7 21 2" fill="none" stroke="#4e9a35" stroke-width="2.4" opacity=".55"/>
  <ellipse cx="32" cy="46" rx="8" ry="7.5" fill="#cfe8a8" stroke="none" transform="rotate(-12 32 46)"/>
  <!-- front leg striding -->
  <path d="M35 53l6 5" stroke-width="6"/>
  <path d="M35 53l6 5" stroke-width="3.2" stroke="#6abf4b"/>
  <ellipse cx="44" cy="59" rx="5" ry="2.6" fill="#6abf4b"/>
  <!-- front arm pumping -->
  <path d="M38 40l8-4" stroke-width="5"/>
  <path d="M38 40l8-4" stroke-width="2.4" stroke="#6abf4b"/>
  <circle cx="48" cy="35" r="3.4" fill="#6abf4b"/>
  <!-- head -->
  <ellipse cx="33" cy="25" rx="18" ry="11.5" fill="#6abf4b"/>
  <path d="M17 28c4 6 18 8 30 3" fill="none" stroke="#4e9a35" stroke-width="2.4" opacity=".5"/>
  <!-- eye bumps: wide open, freedom! -->
  <circle cx="25" cy="15" r="7.5" fill="#6abf4b"/>
  <circle cx="41" cy="15" r="7.5" fill="#6abf4b"/>
  <circle cx="25" cy="15" r="5.6" fill="#fff"/>
  <circle cx="41" cy="15" r="5.6" fill="#fff"/>
  <circle cx="27.5" cy="14.5" r="2.5" fill="#1f2a1a" stroke="none"/>
  <circle cx="43.5" cy="14.5" r="2.5" fill="#1f2a1a" stroke="none"/>
  <circle cx="28.3" cy="13.6" r=".8" fill="#fff" stroke="none"/>
  <circle cx="44.3" cy="13.6" r=".8" fill="#fff" stroke="none"/>
  <!-- huge gleeful open grin -->
  <path d="M23 27c5 3 15 3 24-1-1 5-6 8-12 8-6 0-10-3-12-7z" fill="#c62828"/>
  <path d="M29 31.5c2-1.3 5-1.5 7.5-.4" fill="none" stroke="#ff8a80" stroke-width="1.6"/>
  <ellipse cx="48.5" cy="25" rx="2.6" ry="1.6" fill="#f48fb1" stroke="none" opacity=".7"/>
  <!-- sweat drop -->
  <path d="M14 18c-2 3-2 5 0 5.5s2.5-2.5 0-5.5z" fill="#64b5f6" stroke="#1e88e5" stroke-width="1"/>
</svg>
